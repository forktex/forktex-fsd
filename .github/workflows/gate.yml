# On every push and pull request: the whole gate on Linux, the suite natively on macOS and Windows.
# All logic lives in fsd.toml; this file only installs the toolchain and asks fsd to run it.
name: gate

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  # Linux runs the whole gate, including the container suite across Linux userlands.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "poetry>=2.2,<3"
      - run: poetry install --with dev
      - run: poetry run fsd assurance
      - run: poetry run fsd security
      - run: poetry run fsd documentation
      - run: poetry run fsd build

  # macOS and Windows cannot run in a container, so the suite runs on them natively.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "poetry>=2.2,<3"
      - run: poetry install --with dev
      - run: poetry run fsd test
      - run: poetry run fsd build
