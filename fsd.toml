# This repository, bound to the standard it implements. This file is the only
# place its commands live: `fsd assurance`, `fsd security` and `fsd documentation`
# are the gate, and `fsd build` makes the artifact. Every command goes through
# poetry, so it runs the same on any OS.
standard = "1.0"
profile = "library"

[operation]
setup = ["poetry install --with dev", 'poetry run python -m pip install -q --upgrade "pip>=26.1.2"']
clean = "poetry run python scripts/clean.py"
# custom: rewrite the source into shape — under operation, so it never runs with a checks track
tidy = [
    "poetry run ruff format src tests scripts",
    "poetry run ruff check --fix src tests scripts",
    "poetry run python scripts/license_headers.py fix",
]

[assurance]
format = "poetry run ruff format --check src tests scripts"
lint = ["poetry run ruff check src tests scripts", "poetry run lint-imports"]
validate = "poetry run pyright src"
test = { run = "poetry run pytest tests/usage tests/contract -q --cov=src/forktex_fsd --cov-branch --cov-report=term-missing --cov-report=xml:build/coverage.xml --junitxml=build/junit.xml --cov-fail-under=100", results = ["build/junit.xml", "build/coverage.xml"] }
license = "poetry run python scripts/license_headers.py check"
platforms = "poetry run pytest tests/platforms -q -p no:cacheprovider"

[security]
audit = ["poetry check --lock", "poetry run pip-audit --skip-editable --timeout 30"]

[delivery]
build = [
    "poetry run python scripts/clean.py dist",
    "poetry run python -m build",
    "poetry run twine check dist/*",
    "poetry run python scripts/smoke.py",
]
publish = ["poetry run python scripts/release_check.py", "poetry run twine upload dist/*"]
# custom: tag the release commit v<version> and push the tag, once every other release check passes
tag = "poetry run python scripts/release_check.py tag"

[documentation]
manual = { file = ["README.md", "AGENTS.md", "docs/guide.md", "docs/reference.md", "docs/development.md"] }
